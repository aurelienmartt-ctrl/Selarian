<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <title>Selarian - Carte Interactive Locale</title>

  <script src="./leaflet.js"></script>

  <style>
    html, body, #map { 
      width: 100%; 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      background-color: #111111; 
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      
      // Vérification de sécurité locale
      if (typeof L === 'undefined') {
        console.error("Erreur critique : Le fichier leaflet.js local n'a pas pu s'exécuter.");
        return;
      }

      // Initialisation de la carte locale
      var map = L.map('map').setView([0, 0], 2);
    });
  </script>
