<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selarian - Mode Hors-Ligne</title>
  <link rel="stylesheet" href="./leaflet.css" />
  <script src="./leaflet.js"></script>
</head>
<body>

  <div id="map"></div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      
      // Initialisation de la carte sur votre écran
      var map = L.map('map').setView([0, 0], 2);

      // Activation du lecteur de fichier KMZ Google Earth
      var kmz = L.kmzLayer().addTo(map);

      // Chargement de votre fichier Selarian.kmz présent dans le dossier
      kmz.load('./Selarian.kmz');

      // Dès que le fichier est lu, la console valide l'opération
      kmz.on('loaded', function(e) {
        console.log("Fichier Selarian.kmz détecté avec succès en local !");
      });

    });
  </script>
</body>
</html>
