<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selarian - Carte Interactive</title>
  
  <!-- Chargement des bibliothèques via des liens alternatifs ultra-rapides -->
  <link rel="stylesheet" href="https://jsdelivr.net" />
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>

  <style>
    html, body, #map { 
      width: 100%; 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      background-color: #111111; 
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // On attend que TOUTE la page et les scripts soient chargés à 100% dans le navigateur
    window.addEventListener('load', function() {
      
      // Sécurité si Leaflet a été bloqué par un pare-feu
      if (typeof L === 'undefined') {
        console.error("Erreur : La bibliothèque Leaflet n'a pas pu être téléchargée par le réseau.");
        return;
      }

      // Initialisation de la carte plate
      var map = L.map('map').setView([0, 0], 2);

      // Configuration du module KMZ
      var kmz = L.kmzLayer().addTo(map);

      // Chargement de votre fichier
      kmz.load('./Selarian.kmz');

      // Recentrage automatique au chargement
      kmz.on('loaded', function(e) {
        map.fitBounds(e.layer.getBounds());
        console.log("Selarian.kmz chargé avec succès !");
      });

    });
  </script>
</body>
</html>
