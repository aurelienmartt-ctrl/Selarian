<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selarian 3D</title>
  
  <!-- Chargement sécurisé du style visuel -->
  <link href="https://unpkg.com" rel="stylesheet">
  
  <!-- Configuration d'une carte d'importation (Import Map) acceptée par GitHub Pages -->
  <script type="importmap">
    {
      "imports": {
        "cesium": "https://unpkg.com"
      }
    }
  </script>

  <style>
    html, body, #cesiumContainer { 
      width: 100%; 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      background-color: #000;
    }
  </style>
</head>
<body>

  <div id="cesiumContainer"></div>

  <!-- Utilisation du script en mode module pour charger Cesium de manière isolée -->
  <script type="module">
    import * as Cesium from 'cesium';

    // Validation de votre clé d'accès (Token)
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IlJZb2NLN2MzYVRtYWduVVIiLCJqdGkiOiI1MDU3Mzk3NS0wZDRjLTRkY2QtYTBhMS1lNjEwMzhmZmI5M2QiLCJpZCI6NDcxMzc1LCJpc3MiOiJodHRwczovL2FwaS5jZXNpidW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODc1OTY5MjZ9.3FWq2wZVZQprkQ3fVHdnpgeewjz1YzjNyFE6tAEOVXM';

    // Initialisation du globe virtuel 3D officiel
    const viewer = new Cesium.Viewer('cesiumContainer', {
      sceneModePicker: false,
      baseLayerPicker: false
    });

    // Intégration et zoom sur votre fichier Selarian.kmz
    async function chargerDonnees() {
      try {
        const dataSource = await Cesium.KmlDataSource.load('./Selarian.kmz', {
          camera: viewer.scene.camera,
          canvas: viewer.scene.canvas
        });
        await viewer.dataSources.add(dataSource);
        viewer.zoomTo(dataSource);
        console.log("Fichier Selarian.kmz chargé avec succès !");
      } catch (error) {
        console.error("Erreur de lecture du fichier Selarian.kmz :", error);
      }
    }

    chargerDonnees();
  </script>
</body>
</html>
