<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selarian Interactive</title>
  
  <style>
    /* La carte prend tout l'écran */
    html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #111; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // Initialisation dynamique sans serveur externe bloqué
    function initMap() {
      // Création de la carte centrée
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 2,
        center: { lat: 0, lng: 0 },
        mapTypeId: "satellite" // Utilise la vue satellite (globe) de Google
      });

      // Chargement direct et sécurisé de votre fichier KMZ depuis votre GitHub
      // Note : Google Maps télécharge le fichier côté serveur, le CORS ne peut pas bloquer !
      const kmlUrl = "https://github.io"; 
      
      const kmlLayer = new google.maps.KmlLayer({
        url: kmlUrl,
        suppressInfoWindows: false,
        map: map
      });

      kmlLayer.addListener("status_changed", () => {
        console.log("Statut du KMZ :", kmlLayer.getStatus());
      });
    }
  </script>

  <!-- Chargement de l'API Google Maps officielle (Autorisée partout sur internet) -->
  <script src="https://googleapis.com" async defer></script>

</body>
</html>
