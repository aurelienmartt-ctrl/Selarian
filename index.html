<head>

  <link href="https://cloudflare.com" rel="stylesheet">

    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body>

  <div id="cesiumContainer"></div>

  <script>
    // LA LIGNE INDISPENSABLE : Collez votre jeton Cesium entre les guillemets ci-dessous
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IlJZb2NLN2MzYVRtYWduVVIiLCJqdGkiOiI1MDU3Mzk3NS0wZDRjLTRkY2QtYTBhMS1lNjEwMzhmZmI5M2QiLCJpZCI6NDcxMzc1LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODc1OTY5MjZ9.3FWq2wZVZQprkQ3fVHdnpgeewjz1YzjNyFE6tAEOVXM';

    // Initialisation du globe virtuel 3D officiel
    const viewer = new Cesium.Viewer('cesiumContainer', {
      sceneModePicker: false,
      baseLayerPicker: false
    });

    // Chargement automatique de votre fichier KMZ
    // (Pensez à remplacer 'ma-carte.kmz' par le nom exact de votre fichier)
    viewer.dataSources.add(Cesium.KmlDataSource.load('./Selarian.kmz', {
      camera: viewer.scene.camera,
      canvas: viewer.scene.canvas
    })).then(function(dataSource){
      viewer.zoomTo(dataSource);
    }).catch(function(error){
      console.error("Erreur de chargement du KMZ :", error);
    });
  </script>
</body>
