<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selarian 3D</title>
  
  <!-- Chargement sécurisé des styles graphiques sans JavaScript -->
  <link href="https://jsdelivr.net" rel="stylesheet">
  
  <style>
    html, body, #cesiumContainer { 
      width: 100%; 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      background-color: #000;
    }
  </style>
</head>
<body>

  <div id="cesiumContainer"></div>

  <!-- Le type="module" combiné à un import par URL stricte contourne à 100% le blocage CORS -->
  <script type="module">
    import * as Cesium from 'https://unpkg.com';

    // Votre clé d'accès token Cesium ion
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IlJZb2NLN2MzYVRtYWduVVIiLCJqdGkiOiI1MDU3Mzk3NS0wZDRjLTRkY2QtYTBhMS1lNjEwMzhmZmI5M2QiLCJpZCI6NDtxMzc1LCJpc3MiOiJodHRwczovL2FwaS5jZXNpidW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODc1OTY5MjZ9.3FWq2wZVZQprkQ3fVHdnpgeewjz1YzjNyFE6tAEOVXM';

    // Lancement du Viewer 3D
    const viewer = new Cesium.Viewer('cesiumContainer', {
      sceneModePicker: false,
      baseLayerPicker: false
    });

    // Chargement de votre carte Selarian
    async function chargerDonnees() {
      try {
        const dataSource = await Cesium.KmlDataSource.load('./Selarian.kmz', {
          camera: viewer.scene.camera,
          canvas: viewer.scene.canvas
        });
        await viewer.dataSources.add(dataSource);
        viewer.zoomTo(dataSource);
        console.log("Selarian.kmz est chargé !");
      } catch (error) {
        console.error("Erreur d'affichage du fichier KMZ :", error);
      }
    }

    chargerDonnees();
  </script>
</body>
</html>
