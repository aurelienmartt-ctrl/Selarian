<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Selarian</title>
  
  <!-- Chargeur officiel universel fourni par Cesium -->
  <script src="https://cesium.com"></script>
  <link href="https://cesium.com" rel="stylesheet">
  
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body>

  <div id="cesiumContainer"></div>

  <script>
    // Cette fonction attend que toute la page et Cesium soient chargés dans le navigateur
    window.addEventListener('load', function() {
      
      // Enregistrement de votre clé d'accès (Token)
      Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IlJZb2NLN2MzYVRtYWduVVIiLCJqdGkiOiI1MDU3Mzk3NS0wZDRjLTRkY2QtYTBhMS1lNjEwMzhmZmI5M2QiLCJpZCI6NDcxMzc1LCJpc3MiOiJodHRwczovL2FwaS5jZXNpidW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODc1OTY5MjZ9.3FWq2wZVZQprkQ3fVHdnpgeewjz1YzjNyFE6tAEOVXM';

      // Lancement du globe terrestre virtuel 3D
      const viewer = new Cesium.Viewer('cesiumContainer', {
        sceneModePicker: false,
        baseLayerPicker: false
      });

      // Intégration sécurisée de votre fichier de carte Selarian.kmz
      Cesium.KmlDataSource.load('./Selarian.kmz', {
        camera: viewer.scene.camera,
        canvas: viewer.scene.canvas
      }).then(function(dataSource) {
        viewer.dataSources.add(dataSource);
        viewer.zoomTo(dataSource);
      }).catch(function(error) {
        console.error("Erreur d'ouverture du fichier Selarian.kmz :", error);
      });

    });
  </script>
</body>
</html>
